<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>MH Game</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;width:100%;height:100%;overflow:hidden;font-family:Arial,sans-serif;background:#06142b;color:#fff}
body{display:flex;justify-content:center}
#app{width:100%;max-width:720px;height:100%;position:relative;overflow:hidden;background:radial-gradient(circle at 50% 25%,#123d79 0,#071b3a 42%,#030b18 100%)}
canvas{position:absolute;inset:0;width:100%;height:100%}
.top{position:absolute;top:0;left:0;right:0;padding:14px 14px 8px;display:flex;gap:8px;justify-content:space-between;z-index:3}
.card{min-width:92px;padding:9px 12px;border:1px solid #2e79d4;border-radius:14px;background:#0a2345cc;backdrop-filter:blur(8px);text-align:center;box-shadow:0 5px 20px #0005}
.label{font-size:11px;color:#8dbcf0}.value{font-size:22px;font-weight:800;margin-top:2px}
.screen{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;z-index:5;padding:24px}
.panel{width:min(92%,480px);padding:28px 22px;border-radius:26px;background:#071a35eF;border:1px solid #3189ee;box-shadow:0 20px 70px #0009;text-align:center}
.logo{font-size:56px;font-weight:1000;letter-spacing:-4px;color:#5ce1ff;text-shadow:0 0 25px #00aaff}
h1{margin:0 0 6px;font-size:34px}.sub{color:#9ec7ef;line-height:1.5;margin-bottom:22px}
button{border:0;border-radius:16px;padding:15px 28px;font-size:18px;font-weight:800;color:white;background:linear-gradient(135deg,#168cff,#00c8ff);box-shadow:0 9px 25px #008cff55;cursor:pointer}
button:active{transform:scale(.97)}
.small{font-size:12px;color:#7599bd;margin-top:15px}
#gameOver{display:none}
#toast{position:absolute;left:50%;top:18%;transform:translateX(-50%);z-index:8;font-size:24px;font-weight:900;color:#fff;text-shadow:0 2px 8px #000;opacity:0;pointer-events:none}
</style>
</head>
<body>
<div id="app">
<canvas id="game"></canvas>
<div class="top">
  <div class="card"><div class="label">SCORE</div><div id="score" class="value">0</div></div>
  <div class="card"><div class="label">TIME</div><div id="time" class="value">30</div></div>
  <div class="card"><div class="label">BEST</div><div id="best" class="value">0</div></div>
</div>

<div id="start" class="screen">
  <div class="panel">
    <div class="logo">MH</div>
    <h1>MH GAME</h1>
    <div class="sub">Coin Rush — tap the glowing coins, avoid the bombs, and get the highest score!</div>
    <button id="startBtn">🎮 START GAME</button>
    <div class="small">Made for Telegram Mini App • Mobile friendly</div>
  </div>
</div>

<div id="gameOver" class="screen">
  <div class="panel">
    <div class="logo">MH</div>
    <h1>GAME OVER</h1>
    <div class="sub">Your score</div>
    <div id="finalScore" style="font-size:54px;font-weight:1000;color:#ffd45a;margin:-8px 0 20px">0</div>
    <button id="againBtn">🔄 PLAY AGAIN</button>
  </div>
</div>
<div id="toast">+10</div>
</div>

<script>
const tg = window.Telegram?.WebApp;
if(tg){ tg.ready(); tg.expand(); }
const canvas=document.getElementById('game'),ctx=canvas.getContext('2d');
const scoreEl=document.getElementById('score'),timeEl=document.getElementById('time'),bestEl=document.getElementById('best');
let W,H,dpr,items=[],particles=[],score=0,timeLeft=30,running=false,last=0,spawn=0;
let best=Number(localStorage.getItem('mh_best')||0); bestEl.textContent=best;

function resize(){
 dpr=Math.min(devicePixelRatio||1,2); W=innerWidth; H=innerHeight;
 canvas.width=W*dpr; canvas.height=H*dpr; ctx.setTransform(dpr,0,0,dpr,0,0);
}
addEventListener('resize',resize); resize();

function rand(a,b){return a+Math.random()*(b-a)}
function spawnItem(){
 const r=rand(22,34), bomb=Math.random()<0.18;
 items.push({x:rand(r+10,W-r-10),y:rand(115,H-r-35),r,bomb,life:0,rot:rand(0,6.28),vx:rand(-35,35),vy:rand(-25,25)});
}
function burst(x,y,bomb){
 for(let i=0;i<18;i++) particles.push({x,y,vx:rand(-160,160),vy:rand(-160,160),life:.6,r:rand(2,5),bomb});
}
function showToast(text){
 const t=document.getElementById('toast');t.textContent=text;t.style.opacity=1;
 clearTimeout(showToast.t);showToast.t=setTimeout(()=>t.style.opacity=0,450);
}
function reset(){
 items=[];particles=[];score=0;timeLeft=30;spawn=0;scoreEl.textContent=0;timeEl.textContent=30;
}
function start(){
 reset();running=true;document.getElementById('start').style.display='none';document.getElementById('gameOver').style.display='none';
 last=performance.now();requestAnimationFrame(loop);
}
function end(){
 running=false; if(score>best){best=score;localStorage.setItem('mh_best',best);bestEl.textContent=best}
 document.getElementById('finalScore').textContent=score;document.getElementById('gameOver').style.display='flex';
}
function loop(now){
 if(!running)return;
 const dt=Math.min((now-last)/1000,.05);last=now;
 timeLeft-=dt;if(timeLeft<=0){timeLeft=0;timeEl.textContent=0;end();return}
 timeEl.textContent=Math.ceil(timeLeft);
 spawn-=dt;if(spawn<=0){spawnItem();spawn=rand(.35,.7)}
 ctx.clearRect(0,0,W,H);
 // subtle stars
 for(let i=0;i<35;i++){let x=(i*97)%W,y=(i*53+70)%H;ctx.fillStyle='rgba(130,200,255,.25)';ctx.fillRect(x,y,2,2)}
 for(const it of items){it.life+=dt;it.x+=it.vx*dt;it.y+=it.vy*dt;it.rot+=dt*2;
  if(it.x<it.r||it.x>W-it.r)it.vx*=-1;if(it.y<110+it.r||it.y>H-it.r)it.vy*=-1;
  ctx.save();ctx.translate(it.x,it.y);ctx.rotate(it.rot);
  ctx.shadowBlur=25;ctx.shadowColor=it.bomb?'#ff315c':'#ffd43b';
  ctx.beginPath();ctx.arc(0,0,it.r,0,Math.PI*2);ctx.fillStyle=it.bomb?'#ff315c':'#ffd43b';ctx.fill();
  ctx.shadowBlur=0;ctx.fillStyle='#fff';ctx.font=`bold ${it.r*1.05}px Arial`;ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(it.bomb?'💣':'★',0,1);
  ctx.restore();
 }
 for(let i=particles.length-1;i>=0;i--){let p=particles[i];p.life-=dt;p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=220*dt;
  ctx.globalAlpha=Math.max(0,p.life/.6);ctx.fillStyle=p.bomb?'#ff5278':'#ffe36a';ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,7);ctx.fill();ctx.globalAlpha=1;
  if(p.life<=0)particles.splice(i,1)
 }
 requestAnimationFrame(loop);
}
function hit(x,y){
 if(!running)return;
 for(let i=items.length-1;i>=0;i--){let it=items[i],d=Math.hypot(x-it.x,y-it.y);
  if(d<it.r+18){items.splice(i,1);burst(it.x,it.y,it.bomb);
   if(it.bomb){score=Math.max(0,score-15);showToast('💥 -15')}else{score+=10;showToast('+10 ✨')}
   scoreEl.textContent=score;return;
  }
 }
}
canvas.addEventListener('pointerdown',e=>{const r=canvas.getBoundingClientRect();hit(e.clientX-r.left,e.clientY-r.top)});
document.getElementById('startBtn').onclick=start;document.getElementById('againBtn').onclick=start;
</script>
</body>
</html>
